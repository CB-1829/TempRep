<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAccount PWA</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            accent: '#6366f1'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .glass {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(16px);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <!-- Main PWA Focus Card -->
    <main class="max-w-md w-full bg-slate-800/80 backdrop-blur-xl border border-slate-700/80 rounded-3xl p-8 shadow-2xl text-center flex flex-col items-center space-y-6">
        
        <!-- Generated Dynamic PWA App Icon Preview -->
        <div class="relative group">
            <div class="absolute -inset-1 bg-gradient-to-r from-teal-500 to-indigo-600 rounded-3xl blur opacity-40 group-hover:opacity-75 transition duration-500"></div>
            <div class="relative w-28 h-28 rounded-2xl bg-gradient-to-br from-teal-500 to-indigo-600 flex items-center justify-center shadow-2xl overflow-hidden">
                <canvas id="iconPreviewCanvas" width="112" height="112" class="rounded-2xl"></canvas>
            </div>
        </div>

        <div class="space-y-2">
            <h1 class="text-3xl font-extrabold tracking-tight">NexusAccount</h1>
            <p class="text-slate-400 text-sm">Progressive Web Application (PWA)</p>
        </div>

        <!-- PWA Status Badge -->
        <div id="pwaStatus" class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-700/60 text-slate-300 border border-slate-600/50">
            <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse" id="statusDot"></span>
            <span id="statusText">Initializing PWA Engine...</span>
        </div>

        <!-- Direct Native Install Button -->
        <button id="pwaInstallBtn" onclick="installPWA()" class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-teal-500 to-indigo-600 text-white font-bold text-sm shadow-lg shadow-teal-500/20 hover:shadow-teal-500/40 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2">
            <i data-lucide="download" class="w-5 h-5"></i>
            <span id="btnText">Install App</span>
        </button>

        <p class="text-xs text-slate-500 leading-relaxed" id="footerMsg">
            Native PWA trigger ready. Tested and compliant with Chrome/Chromium installation requirements.
        </p>
    </main>

    <!-- Modal Dialog (Strictly for explicit native response reporting, no fake guides) -->
    <div id="pwaModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden transition-opacity duration-300">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center space-y-4">
            <div class="w-12 h-12 bg-teal-500/10 text-teal-400 rounded-full flex items-center justify-center mx-auto" id="modalIcon">
                <i data-lucide="info" class="w-6 h-6"></i>
            </div>
            <h3 id="modalTitle" class="text-lg font-bold text-white">Installation Status</h3>
            <p id="modalBody" class="text-sm text-slate-300 leading-relaxed"></p>
            <button onclick="closeModal()" class="w-full py-2.5 bg-slate-700 hover:bg-slate-600 text-white font-semibold text-sm rounded-xl transition">
                Close
            </button>
        </div>
    </div>

    <script>
        let deferredPrompt = null;

        // Helper function to generate clean standard PNG Data URLs for Web App Manifest
        function createPngIconDataUrl(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Draw Gradient Background
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#0d9488'); // Teal 600
            gradient.addColorStop(1, '#4f46e5'); // Indigo 600
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            const radius = size * 0.2; // Rounded corners
            ctx.roundRect(0, 0, size, size, radius);
            ctx.fill();

            // Draw "Nexus" text centered
            ctx.fillStyle = '#ffffff';
            ctx.font = `900 ${Math.round(size * 0.22)}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('Nexus', size / 2, size / 2);

            return canvas.toDataURL('image/png');
        }

        // Render card preview icon
        function renderPreviewIcon() {
            const previewCanvas = document.getElementById('iconPreviewCanvas');
            if (!previewCanvas) return;
            const ctx = previewCanvas.getContext('2d');
            const size = 112;

            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#0d9488');
            gradient.addColorStop(1, '#4f46e5');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);

            ctx.fillStyle = '#ffffff';
            ctx.font = '900 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('Nexus', size / 2, size / 2);
        }

        // Dynamic Manifest & Service Worker Setup
        (function setupDynamicPWA() {
            renderPreviewIcon();

            // Create standard PNG icons required by Chrome PWA specs
            const icon192 = createPngIconDataUrl(192);
            const icon512 = createPngIconDataUrl(512);

            // Favicon injection
            const favicon = document.createElement('link');
            favicon.rel = 'icon';
            favicon.type = 'image/png';
            favicon.href = icon192;
            document.head.appendChild(favicon);

            // Absolute URL to prevent start_url resolution errors
            const currentUrl = window.location.href.split('#')[0].split('?')[0];

            // Manifest definition complying with all Chromium installation criteria
            const manifest = {
                name: "NexusAccount",
                short_name: "Nexus",
                description: "NexusAccount Progressive Web Application Core",
                start_url: currentUrl,
                scope: currentUrl,
                display: "standalone",
                orientation: "any",
                background_color: "#0f172a",
                theme_color: "#0d9488",
                icons: [
                    {
                        src: icon192,
                        sizes: "192x192",
                        type: "image/png",
                        purpose: "any maskable"
                    },
                    {
                        src: icon512,
                        sizes: "512x512",
                        type: "image/png",
                        purpose: "any maskable"
                    }
                ]
            };

            const manifestDataUrl = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
            const manifestLink = document.createElement('link');
            manifestLink.rel = 'manifest';
            manifestLink.href = manifestDataUrl;
            document.head.appendChild(manifestLink);

            // Inline Service Worker setup for offline caching
            if ('serviceWorker' in navigator) {
                const swCode = `
                    const CACHE_NAME = 'nexus-pwa-v3';
                    self.addEventListener('install', (e) => self.skipWaiting());
                    self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
                    self.addEventListener('fetch', (e) => {
                        e.respondWith(
                            caches.match(e.request).then((res) => res || fetch(e.request))
                        );
                    });
                `;
                const swBlob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(swBlob);
                navigator.serviceWorker.register(swUrl)
                    .then(() => updateStatus(true, "PWA Ready & Service Worker Active"))
                    .catch(() => updateStatus(false, "Service Worker Error"));
            } else {
                updateStatus(false, "Service Workers Not Supported");
            }
        })();

        // Store the native install event when fired by browser
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            updateStatus(true, "Native Install Prompt Ready");
            const btnText = document.getElementById('btnText');
            if (btnText) btnText.textContent = "Install App";
        });

        // Listen for completed installation
        window.addEventListener('appinstalled', () => {
            deferredPrompt = null;
            updateStatus(true, "App Installed");
            const btnText = document.getElementById('btnText');
            if (btnText) btnText.textContent = "App Already Installed";
        });

        // Action when user clicks the Install Button
        function installPWA() {
            if (deferredPrompt) {
                // Execute real native browser install dialog directly
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        updateStatus(true, "Installing NexusAccount...");
                    } else {
                        updateStatus(true, "Installation Cancelled");
                    }
                    deferredPrompt = null;
                });
            } else {
                // Check if already running as installed app
                const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
                if (isStandalone) {
                    showModal("Already Installed", "NexusAccount is already installed and running in standalone application mode.");
                } else {
                    showModal("Environment Notice", "The browser has not emitted the direct installation trigger for this tab context yet. Ensure you are visiting this URL directly in Chrome, Edge, or Android Chrome.");
                }
            }
        }

        function showModal(title, message) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').textContent = message;
            const modal = document.getElementById('pwaModal');
            modal.classList.remove('hidden');
        }

        function closeModal() {
            const modal = document.getElementById('pwaModal');
            modal.classList.add('hidden');
        }

        function updateStatus(active, text) {
            const dot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            if (dot && statusText) {
                dot.className = active ? "w-2 h-2 rounded-full bg-emerald-400" : "w-2 h-2 rounded-full bg-rose-400";
                statusText.textContent = text;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
