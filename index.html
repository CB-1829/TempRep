<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAccount</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            400: '#2dd4bf',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            800: '#115e59',
                            900: '#134e4a',
                            accent: '#6366f1'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Chart.js for financial analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* Custom scrollbar and sleek styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #334155;
        }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <!-- PWA Focus Card -->
    <main class="max-w-md w-full bg-slate-800/80 backdrop-blur-xl border border-slate-700/80 rounded-3xl p-8 shadow-2xl text-center flex flex-col items-center space-y-6">
        
        <!-- Generated Dynamic PWA App Icon -->
        <div class="relative group">
            <div class="absolute -inset-1 bg-gradient-to-r from-teal-500 to-indigo-600 rounded-3xl blur opacity-40 group-hover:opacity-75 transition duration-500"></div>
            <div class="relative w-28 h-28 rounded-2xl bg-gradient-to-br from-teal-500 to-indigo-600 flex items-center justify-center shadow-2xl">
                <span class="text-white font-extrabold text-3xl tracking-tight">Nexus</span>
            </div>
        </div>

        <div class="space-y-2">
            <h1 class="text-3xl font-extrabold tracking-tight">NexusAccount</h1>
            <p class="text-slate-400 text-sm">Progressive Web Application (PWA) Core</p>
        </div>

        <!-- PWA Status Badge -->
        <div id="pwaStatus" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-700/60 text-slate-300 border border-slate-600/50">
            <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse" id="statusDot"></span>
            <span id="statusText">Checking PWA compatibility...</span>
        </div>

        <!-- Primary Action / Install Button -->
        <button id="pwaInstallBtn" onclick="installPWA()" class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-teal-500 to-indigo-600 text-white font-bold text-sm shadow-lg shadow-teal-500/20 hover:shadow-teal-500/40 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2">
            <i data-lucide="download" class="w-5 h-5"></i>
            <span>Install App</span>
        </button>

        <p class="text-xs text-slate-500 leading-relaxed">
            This app features dynamic manifest generation and offline service worker caching with the customized background icon.
        </p>
    </main>

    <!-- PWA & Application Scripting -->
    <script>
        let deferredPrompt = null;

        // Dynamic Manifest & Service Worker Generation
        (function setupDynamicPWA() {
            // SVG Icon: "Nexus" text over Gradient (#0d9488 Teal to #4f46e5 Indigo)
            const logoSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
                <defs>
                    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#0d9488" />
                        <stop offset="100%" stop-color="#4f46e5" />
                    </linearGradient>
                </defs>
                <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
                <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="92" letter-spacing="-2">Nexus</text>
            </svg>`;

            const svgBlob = new Blob([logoSvg], { type: 'image/svg+xml' });
            const svgUrl = URL.createObjectURL(svgBlob);

            // Append favicon dynamically
            const favicon = document.createElement('link');
            favicon.rel = 'icon';
            favicon.type = 'image/svg+xml';
            favicon.href = svgUrl;
            document.head.appendChild(favicon);

            // Construct PWA Web App Manifest
            const manifest = {
                name: "NexusAccount",
                short_name: "NexusAccount",
                description: "NexusAccount PWA Core Application",
                start_url: "./",
                display: "standalone",
                background_color: "#0f172a",
                theme_color: "#0d9488",
                icons: [
                    {
                        src: svgUrl,
                        sizes: "512x512",
                        type: "image/svg+xml",
                        purpose: "any maskable"
                    }
                ]
            };

            const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            const manifestUrl = URL.createObjectURL(manifestBlob);
            const manifestLink = document.createElement('link');
            manifestLink.rel = 'manifest';
            manifestLink.href = manifestUrl;
            document.head.appendChild(manifestLink);

            // Dynamic Service Worker Injection for Offline Capabilities
            if ('serviceWorker' in navigator) {
                const swCode = `
                    const CACHE_NAME = 'nexus-account-pwa-v1';
                    self.addEventListener('install', (e) => {
                        e.waitUntil(
                            caches.open(CACHE_NAME).then((cache) => cache.addAll(['./']))
                        );
                    });
                    self.addEventListener('fetch', (e) => {
                        e.respondWith(
                            caches.match(e.request).then((res) => res || fetch(e.request))
                        );
                    });
                `;
                const swBlob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(swBlob);
                navigator.serviceWorker.register(swUrl)
                    .then(() => updateStatus(true, "Ready to Install & Works Offline"))
                    .catch((err) => updateStatus(false, "PWA SW registration failed"));
            } else {
                updateStatus(false, "Service Workers not supported");
            }
        })();

        // Listen for PWA installation prompt
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            updateStatus(true, "App Ready for Installation");
        });

        // Install Action
        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        updateStatus(true, "App Installed Successfully");
                    }
                    deferredPrompt = null;
                });
            } else {
                alert("Installation prompt is not directly available. If using Chrome/Safari, click 'Add to Home Screen' or 'Install' from browser options.");
            }
        }

        function updateStatus(active, text) {
            const dot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            if (dot && statusText) {
                dot.className = active ? "w-2 h-2 rounded-full bg-emerald-400" : "w-2 h-2 rounded-full bg-rose-400";
                statusText.textContent = text;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
