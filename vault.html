<script src="https://accounts.google.com/gsi/client" async defer></script>
<button id="authorize_button" onclick="handleAuthClick()">Log in with Gmail</button>
<button id="signout_button" onclick="handleSignoutClick()" style="display:none;">Sign Out</button>
<br><br>
<input type="gmail" id="gmail"> 
<input type="submit" id="send">
<textarea id="body"></textarea>

<script>
  // Insert your Google OAuth Client ID here
  const CLIENT_ID = 'CLI_ID';
  const SCOPES = 'https://www.googleapis.com/auth/gmail.send';

  let tokenClient;
  let accessToken = null;

  // Initialize Google Auth
  window.onload = function() {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: (tokenResponse) => {
        if (tokenResponse.access_token) {
          accessToken = tokenResponse.access_token;
          document.getElementById('authorize_button').innerText = 'Connected!';
          document.getElementById('signout_button').style.display = 'inline';
        }
      },
    });
  };

  function handleAuthClick() {
    tokenClient.requestAccessToken();
  }

  function handleSignoutClick() {
    if (accessToken) {
      google.accounts.oauth2.revoke(accessToken, () => {
        accessToken = null;
        document.getElementById('authorize_button').innerText = 'Log in with Gmail';
        document.getElementById('signout_button').style.display = 'none';
      });
    }
  }

  // Send Email function using Gmail API
  document.getElementById('send').addEventListener('click', async function() {
    var email = document.getElementById('gmail').value;
    var body = document.getElementById('body').value;

    if (!accessToken) {
      alert('Please log in with your Gmail account first!');
      return;
    }

    if (!email) {
      alert('Please enter a recipient email.');
      return;
    }

    // Format RFC 2822 Email string
    const emailContent = 
      `To: ${email}\r\n` +
      `Subject: Message from Website\r\n` +
      `Content-Type: text/plain; charset=utf-8\r\n\r\n` +
      `${body}`;

    // Base64url encode the message
    const encodedMessage = btoa(unescape(encodeURIComponent(emailContent)))
      .replace(/\+/g, '-')
      .replace(/\//g, '_')
      .replace(/=+$/, '');

    // Call Gmail API
    try {
      const response = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${accessToken}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          raw: encodedMessage
        })
      });

      if (response.ok) {
        alert('Email sent successfully!');
      } else {
        const err = await response.json();
        alert('Failed to send: ' + err.error.message);
      }
    } catch (e) {
      alert('Error sending email: ' + e.message);
    }
  });
</script>
