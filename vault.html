<script src="https://accounts.google.com/gsi/client" async defer></script>
<button id="authorize_button" onclick="handleAuthClick()">Log in with Gmail</button>
<button id="signout_button" onclick="handleSignoutClick()" style="display:none;">Sign Out</button>
<br><br>

<div style="margin-bottom: 12px;">
  <label for="client_id_input">Google OAuth Client ID: </label>
  <input type="text" id="client_id_input" placeholder="Enter your OAuth Client ID..." style="width: 300px;">
  <button onclick="saveClientId()">Save Key</button>
</div>

<input type="gmail" id="gmail" placeholder="Recipient Gmail"> 
<input type="submit" id="send" value="Send Email">
<textarea id="body" placeholder="Email body text..."></textarea>

<script>
  let CLIENT_ID = localStorage.getItem('GMAIL_CLIENT_ID') || '';
  const SCOPES = 'https://www.googleapis.com/auth/gmail.send';

  let tokenClient;
  let accessToken = null;

  // Pre-fill input if previously saved
  if (CLIENT_ID) {
    document.getElementById('client_id_input').value = CLIENT_ID;
  }

  function saveClientId() {
    const inputVal = document.getElementById('client_id_input').value.trim();
    if (inputVal) {
      localStorage.setItem('GMAIL_CLIENT_ID', inputVal);
      CLIENT_ID = inputVal;
      initOAuth();
      alert('Client ID saved!');
    }
  }

  function initOAuth() {
    if (!CLIENT_ID) return;
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: (tokenResponse) => {
        if (tokenResponse.access_token) {
          accessToken = tokenResponse.access_token;
          document.getElementById('authorize_button').innerText = 'Connected!';
          document.getElementById('signout_button').style.display = 'inline';
        }
      },
    });
  }

  // Initialize Google Auth on load
  window.onload = function() {
    if (CLIENT_ID) {
      initOAuth();
    }
  };

  function handleAuthClick() {
    if (!CLIENT_ID) {
      alert('Please enter and save a valid OAuth Client ID first.');
      return;
    }
    tokenClient.requestAccessToken();
  }

  function handleSignoutClick() {
    if (accessToken) {
      google.accounts.oauth2.revoke(accessToken, () => {
        accessToken = null;
        document.getElementById('authorize_button').innerText = 'Log in with Gmail';
        document.getElementById('signout_button').style.display = 'none';
      });
    }
  }

  document.getElementById('send').addEventListener('click', function(e) {
    e.preventDefault();
    if (!accessToken) {
      alert('Please click "Log in with Gmail" first to authorize sending emails.');
      return;
    }

    const recipient = document.getElementById('gmail').value;
    const bodyText = document.getElementById('body').value;

    if (!recipient || !bodyText) {
      alert('Please fill out both recipient email and body text.');
      return;
    }

    const email = [
      `To: ${recipient}`,
      'Content-Type: text/plain; charset=utf-8',
      'MIME-Version: 1.0',
      'Subject: Message from Gmail Sender',
      '',
      bodyText
    ].join('\n');

    const base64EncodedEmail = btoa(unescape(encodeURIComponent(email)))
      .replace(/\+/g, '-')
      .replace(/\//g, '_')
      .replace(/=+$/, '');

    fetch('https://gmail.googleapis.com/upload/gmail/v1/users/me/messages/send', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${accessToken}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        raw: base64EncodedEmail
      })
    })
    .then(response => response.json())
    .then(data => {
      if (data.id) {
        alert('Email sent successfully!');
      } else {
        alert('Failed to send email: ' + JSON.stringify(data));
      }
    })
    .catch(error => {
      alert('Error sending email: ' + error);
    });
  });
</script>
