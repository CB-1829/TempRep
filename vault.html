<div style="margin-bottom: 12px;">
  <label for="client_id_input">Google OAuth Client ID: </label>
  <input type="text" id="client_id_input" placeholder="Enter your OAuth Client ID..." style="width: 300px;">
  <button onclick="saveClientId()">Save Key</button>
</div>

<div style="margin-bottom: 12px;">
  <button id="authorize_button" onclick="handleAuthClick()">Log in with Gmail</button>
  <button id="signout_button" onclick="handleSignoutClick()" style="display:none;">Sign Out</button>
</div>

<div id="account_info" style="display:none; margin-bottom: 12px; border: 1px solid #ccc; padding: 10px; border-radius: 6px; max-width: 300px;">
  <img id="user_avatar" src="" alt="Profile Picture" style="width: 50px; height: 50px; border-radius: 50%; vertical-align: middle; margin-right: 10px;">
  <span style="display: inline-block; vertical-align: middle;">
    <strong id="user_name"></strong><br>
    <small id="user_email"></small>
  </span>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
  let CLIENT_ID = localStorage.getItem('GMAIL_CLIENT_ID') || '';
  const SCOPES = 'https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email';

  let tokenClient;
  let accessToken = null;

  // Pre-fill input if previously saved
  if (CLIENT_ID) {
    document.getElementById('client_id_input').value = CLIENT_ID;
  }

  function saveClientId() {
    const inputVal = document.getElementById('client_id_input').value.trim();
    if (inputVal) {
      localStorage.setItem('GMAIL_CLIENT_ID', inputVal);
      CLIENT_ID = inputVal;
      initOAuth();
      alert('Client ID saved!');
    }
  }

  function initOAuth() {
    if (!CLIENT_ID) return;
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: (tokenResponse) => {
        if (tokenResponse.access_token) {
          accessToken = tokenResponse.access_token;
          document.getElementById('authorize_button').innerText = 'Connected!';
          document.getElementById('signout_button').style.display = 'inline';
          fetchAccountInfo();
        }
      },
    });
  }

  // Initialize Google Auth on load
  window.onload = function() {
    if (CLIENT_ID) {
      initOAuth();
    }
  };

  function handleAuthClick() {
    if (!CLIENT_ID) {
      alert('Please enter and save a valid OAuth Client ID first.');
      return;
    }
    if (!tokenClient) {
      initOAuth();
    }
    tokenClient.requestAccessToken();
  }

  function handleSignoutClick() {
    if (accessToken) {
      google.accounts.oauth2.revoke(accessToken, () => {
        accessToken = null;
        document.getElementById('authorize_button').innerText = 'Log in with Gmail';
        document.getElementById('signout_button').style.display = 'none';
        document.getElementById('account_info').style.display = 'none';
      });
    }
  }

  function fetchAccountInfo() {
    fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
      headers: {
        'Authorization': `Bearer ${accessToken}`
      }
    })
    .then(response => response.json())
    .then(data => {
      if (data.email) {
        document.getElementById('user_avatar').src = data.picture || 'https://via.placeholder.com/50';
        document.getElementById('user_name').innerText = data.name || 'User';
        document.getElementById('user_email').innerText = data.email;
        document.getElementById('account_info').style.display = 'block';
      }
    })
    .catch(error => {
      console.error('Error fetching user info:', error);
    });
  }
</script>
